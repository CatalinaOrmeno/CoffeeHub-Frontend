site_name: "CoffeeHub Frontend - Documentación"
site_description: "Documentación técnica del módulo frontend de CoffeeHub"
site_author: "Catalina Ormeño"
site_url: https://catalinaormeno.github.io/CoffeeHub-Frontend/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - code.copy

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Inicio: index.md
  - Gestión Lean:
      - Alcance: SCOPE.md
      - Planificación: PLANNING.md
  - Arquitectura e Infraestructura:
      - Arquitectura e infraestructura: INFRASTRUCTURE.md
      - Guía de configuración: GETTING_STARTED.md
      - Registros de Decisión (ADR):
          - 0001 - Microsoft Entra ID y MSAL: adr/0001-entra-id-app-roles.md
          - 0002 - React + Vite SPA: adr/0002-monolito-modular-eventos.md
          - 0003 - Rutas protegidas y autorización: adr/0003-react-vite-spa-frontend.md
          - 0004 - Despliegue de frontend estático: adr/0004-persistencia-poliglota-sql-nosql.md
          - 0005 - Configuración por entorno y variables VITE_: adr/0005-manejo-de-entornos-ejecucion.md
